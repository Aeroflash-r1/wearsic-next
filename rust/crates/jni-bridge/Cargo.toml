[package]
name = "jni-bridge"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "JNI bridge: exposes the Wearsic Next engine to Kotlin."

[lib]
name = "wearsic_engine"
crate-type = ["cdylib"]

[dependencies]
engine-core = { path = "../engine-core" }
network = { path = "../network" }
innertube = { path = "../innertube" }
ytmusic = { path = "../ytmusic" }
stream-resolver = { path = "../stream-resolver" }
jni = "0.21.1"
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util", "net", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
