[package]
name = "stream-resolver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wearsic Next stream resolution: InnerTube player → validated Media3-compatible stream descriptor."

[dependencies]
network = { path = "../network" }
innertube = { path = "../innertube" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util", "net", "macros"] }
