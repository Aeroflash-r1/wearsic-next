[package]
name = "network"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wearsic Next networking engine: lightweight, cancellable, battery-conscious HTTP client."

[dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util", "net", "macros"] }
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1.10", features = ["client-legacy", "http1", "tokio", "service"] }
hyper-rustls = { version = "0.27.6", default-features = false, features = ["http1", "webpki-roots", "tls12"] }
rustls = { version = "0.23.25", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
http-body-util = "0.1"
bytes = "1.9"
http = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
rand = "0.9"

[dev-dependencies]
tempfile = "3.20"
