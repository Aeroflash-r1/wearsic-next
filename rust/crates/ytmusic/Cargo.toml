[package]
name = "ytmusic"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "YouTube Music search domain models + mapper + service (InnerTube-based)."

[dependencies]
innertube = { path = "../innertube" }
network = { path = "../network" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util", "net", "macros"] }
